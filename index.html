<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pac-Man con Laberinto Completo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Pac-Man Laberinto</h1>
  <p class="status">
    Puntaje: <span id="score">0</span> |
    Nivel: <span id="level-status">Nivel 1</span> |
    Estado: <span id="power-status">Normal</span> |
    Bonus: <span id="bonus-status">Listo</span>
  </p>
  <canvas id="gameCanvas" width="420" height="460"></canvas>
  <button id="restartButton" type="button" hidden>Reiniciar juego</button>
  <p>Usa las <b>flechas del teclado</b> para moverte.</p>

  <script src="script.js"></script>
</body>
</html>
